name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/backend/api/**'
      - 'apps/terminal/**'
      - 'podman-compose*.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/backend/api/**'
      - 'apps/terminal/**'
      - 'podman-compose*.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Type check
        run: npm run typecheck
        working-directory: apps/web

      - name: Unit tests
        run: npm test -- --coverage
        working-directory: apps/web

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: apps/backend

      - name: API tests
        run: python -m pytest tests/test_api_*.py tests/test_ws_*.py -v
        working-directory: apps/backend

  e2e-visual:
    runs-on: ubuntu-latest
    needs: [unit-tests, backend-tests]
    steps:
      - uses: actions/checkout@v4

      # Build and start containers
      - name: Build containers
        run: podman-compose -f podman-compose.test.yml build

      - name: Start services
        run: podman-compose -f podman-compose.test.yml up -d

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 > /dev/null && \
            curl -s http://localhost:8000/api/v1/health > /dev/null && \
            echo "Services ready" && exit 0
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Services failed to start"
          podman-compose -f podman-compose.test.yml logs
          exit 1

      # Install Playwright
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium

      # E2E tests
      - name: Run E2E tests
        run: npx playwright test --config=e2e/playwright.config.ts
        working-directory: apps/web
        env:
          BASE_URL: http://localhost:3000

      # Percy visual regression
      - name: Visual regression
        if: github.event_name == 'pull_request'
        run: npx percy exec -- npx playwright test e2e/tests/visual-regression.spec.ts --config=e2e/playwright.config.ts
        working-directory: apps/web
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BASE_URL: http://localhost:3000

      # Upload results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: apps/web/test-results/

      # Cleanup
      - name: Stop services
        if: always()
        run: podman-compose -f podman-compose.test.yml down
